name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'timorm/fnos-app-health-records' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      minor: ${{ steps.package.outputs.minor }}
      stable: ${{ steps.package.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - name: Read package metadata
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=$(node -p "const [major, minor] = require('./package.json').version.split('.'); major + '.' + minor")" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate, test and typecheck
        run: |
          RELEASE_STRICT_CHANGELOG=1 npm run validate:release
          npm test
          npm run typecheck
      - name: Check duplicate scan performance in isolation
        run: npm run test:duplicates:benchmark

  fpk:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache fnpack
        uses: actions/cache@v4
        with:
          path: tools/fnpack*
          key: ${{ runner.os }}-fnpack-1.2.3
      - name: Download fnpack if needed
        run: npm run download:fnpack
      - name: Build and validate FPK
        run: npm run pack:fpk
      - name: Upload FPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-fpk-${{ needs.prepare.outputs.version }}
          path: |
            dist/app.tgz
            dist/fnos-app-health-records-${{ needs.prepare.outputs.version }}.fpk
          if-no-files-found: error

  docker:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.docker-build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - name: Validate Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets before releasing." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=v${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.minor }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.stable == 'true' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.title=健康档案

      - name: Build and publish Docker image
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
            GATEWAY_PREFIX=/
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Sign Docker image
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.docker-build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  publish:
    needs: [prepare, fpk, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-fpk-${{ needs.prepare.outputs.version }}
          path: dist
      - name: Prepare release notes
        run: node scripts/generate-release-notes.mjs --output=RELEASE_NOTES.md
      - name: Add Docker image to release notes
        shell: bash
        run: |
          cat >> RELEASE_NOTES.md <<'EOF'

          ## Docker 镜像

          ```text
          docker.io/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
          digest: ${{ needs.docker.outputs.digest }}
          platforms: linux/amd64, linux/arm64
          ```

          升级 Compose 部署：

          ```bash
          HEALTH_RECORDS_VERSION=${{ needs.prepare.outputs.version }} docker compose pull
          HEALTH_RECORDS_VERSION=${{ needs.prepare.outputs.version }} docker compose up -d
          ```

          完整安装和回滚说明见 `docs/DOCKER_DEPLOYMENT.md`。
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          tag_name: v${{ needs.prepare.outputs.version }}
          name: 健康档案 v${{ needs.prepare.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/app.tgz
            dist/fnos-app-health-records-${{ needs.prepare.outputs.version }}.fpk
