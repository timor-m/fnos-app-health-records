name: Remove mistaken Docker tags

# One-time repair for the two aliases published on 2026-10-25.
# Other pushes do not run this cleanup; reruns are idempotent.
on:
  push:
    branches: [feat-event]
    paths: [.github/workflows/docker-cleanup-mistaken-tags.yml]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository == 'timor-m/fnos-app-health-records'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remove only the two mistaken aliases after 0.3.0 is available
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = 'timorm/fnos-app-health-records'
          mistaken_digest = 'sha256:c8204c4e6a32ba8424302189a4f46156ff76fd5b4fcff3230a82012046ac38ea'
          tags = ['feat-event', 'feat-event-ee7a5692bbfff58e8853577a3c6e0714eb951a29']
          base = 'https://hub.docker.com/v2/namespaces/timorm/repositories/fnos-app-health-records/tags/'

          def read_tag(tag):
              try:
                  with urllib.request.urlopen(base + tag, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise

          latest = read_tag('latest')
          assert latest and latest.get('digest'), 'Missing latest digest; stopping cleanup.'
          for attempt in range(60):
              version = read_tag('0.3.0')
              if version:
                  break
              time.sleep(10)
          else:
              raise RuntimeError('0.3.0 is not available; no tags were deleted.')
          platforms = {(p.get('os'), p.get('architecture')) for p in version.get('images', [])}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, '0.3.0 is incomplete.'
          assert version.get('digest'), 'Missing 0.3.0 digest; stopping cleanup.'
          for tag in tags:
              current = read_tag(tag)
              assert current is None or current.get('digest') == mistaken_digest, 'Unexpected alias digest; stopping cleanup.'

          request = urllib.request.Request(
              'https://hub.docker.com/v2/auth/token',
              data=json.dumps({'identifier': os.environ['DOCKERHUB_USERNAME'],
                               'secret': os.environ['DOCKERHUB_TOKEN']}).encode(),
              headers={'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              access_token = json.load(response)['access_token']
          for tag in tags:
              if read_tag(tag) is None:
                  print('Already absent:', tag)
                  continue
              # Docker Hub's tag endpoint removes an alias, not a registry manifest.
              request = urllib.request.Request(
                  'https://hub.docker.com/v2/repositories/' + repo + '/tags/' + tag + '/',
                  headers={'Authorization': 'Bearer ' + access_token}, method='DELETE')
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status in (200, 202, 204), 'Tag deletion failed.'
              assert read_tag(tag) is None, 'Deleted alias is still present.'
              print('Removed:', tag)
          assert read_tag('latest')['digest'] == latest['digest'], 'latest changed during cleanup.'
          assert read_tag('0.3.0')['digest'] == version['digest'], '0.3.0 changed during cleanup.'
          print('Verified: 0.3.0 and latest unchanged; mistaken aliases absent.')
          PY
